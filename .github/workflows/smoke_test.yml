name: Smoke test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run smoke test (full pipeline on toy data)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -o pipefail
          python scripts/smoke_test.py 2>&1 | tee smoke_log.txt

      - name: Publish smoke log to job summary
        if: always()
        run: tail -n 80 smoke_log.txt >> "$GITHUB_STEP_SUMMARY"
